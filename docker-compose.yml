version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: sip-downdetector-nginx
    ports:
      - "8000:80"
    volumes:
      # наша конфигурация nginx
      - ./nginx/config.conf:/etc/nginx/conf.d/default.conf:ro
      # статика
      - ./nginx/html:/usr/share/nginx/html:ro
      # логи nginx
      - ./logs:/var/log/nginx
    restart: unless-stopped
