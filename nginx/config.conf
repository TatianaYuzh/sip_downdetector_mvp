server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # главная страница и любая статика
    location / {
        try_files $uri $uri/ /index.html;
    }

    # статический JSON со статусом сервисов
    location = /api/servers.json {
        default_type application/json;
        try_files $uri =404;
    }

    # сюда бьёт скрипт парсинга SIP-логов:
    # /api/logs?key=value&key2=value2
    # nginx просто отвечает 200 и пишет всё в access.log
    location /api/logs {
        return 200;
    }

    # логи (по умолчанию access.log уже содержит URL с query-параметрами)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
